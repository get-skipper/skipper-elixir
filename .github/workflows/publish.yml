name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    environment: hex
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      # Umbrella siblings become regular Hex dependencies.
      HEX_PUBLISH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - name: Copy README and LICENSE into each package
        run: for app in apps/*; do cp README.md LICENSE "$app/"; done
      # skipper_core first: the adapters depend on it from Hex.
      - name: Publish skipper_core
        working-directory: apps/skipper_core
        run: mix deps.get && mix hex.publish --yes
      - name: Publish skipper_ex_unit
        working-directory: apps/skipper_ex_unit
        run: mix deps.get && mix hex.publish --yes
      - name: Publish skipper_espec
        working-directory: apps/skipper_espec
        run: mix deps.get && mix hex.publish --yes
